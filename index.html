<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário JSON</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulário</h1>
    <label for="">Nome</label>
    <br>
    <input type="text" placeholder="Digite o seu nome" id="nomeDigitado">
    <br>
    <label for="">Sobrenome</label>
    <br>
    <input type="text" placeholder="Digite o seu sobrenome" id="sobrenomeDigitado">
    <br>
    <label for="">Data de Nascimento</label>
    <br>
    <input type="date" placeholder="Digite a sua data de nascimento" id="datanasciDigitada">
    <br>
    <label for="">RG</label>
    <br>
    <input type="text" placeholder="Digite o seu RG" id="rgDigitado">
    <br>
    <label for="">CPF</label>
    <br>
    <input type="text" placeholder="Digite o seu CPF" id="cpfDigitado">
    <br>
    <label for="">Nacionalidade</label>
    <br>
    <input type="text" placeholder="Digite a sua nacionalidade" id="nacionalidadeDig">
    <br>
    <label for="">Naturalidade</label>
    <br>
    <input type="text" placeholder="Digite a sua naturalidade" id="naturalidadeDig">
    <br>
    <label for="">Altura</label>
    <br>
    <input type="text" placeholder="Digite a sua altura" id="alturaDigitada">
    <br>
    <label for="">Peso</label>
    <br>
    <input type="text" placeholder="Digite o seu peso" id="pesoDigitado">
    <br><br>
    <button onclick="enviarFormulario()">Enviar</button>

    <script src="script.js"></script>
</body>
</html>
